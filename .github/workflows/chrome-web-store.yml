name: Chrome Web Store package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and verify pdf-lib
        run: npm run vendor

      - name: Test and build
        run: npm run check

      - name: Prepare store package
        shell: bash
        run: |
          set -euo pipefail
          # GitHub creates the downloadable ZIP. Upload the folder, not an inner ZIP.
          rm extension/BUILD_INFO.txt
          test -f extension/manifest.json
          node -e "const m = require('./extension/manifest.json'); if (m.manifest_version !== 3) process.exit(1)"

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: extension/
          if-no-files-found: error
          retention-days: 30
